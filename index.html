<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>ETF08212 - 网格做T记录器</title>
    <meta name="description" content="专业基金与ETF网格交易、日内做T记录器，支持做T摊薄成本、日历看板、收益分析与AI拍照识单" />
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />
    
    <!-- Icons & Theme -->
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <meta name="theme-color" content="#10b981" />
    
    <!-- iOS / Safari PWA Support -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="做T记录器" />
    
    <!-- Open Graph -->
    <meta property="og:title" content="网格做T记录器" />
    <meta property="og:description" content="专业基金与ETF网格交易、日内做T记录器" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body class="bg-slate-950 text-slate-100 antialiased select-none">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    
    <!-- Register Service Worker for PWA -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then((registration) => {
              console.log('PWA ServiceWorker registered with scope:', registration.scope);
            })
            .catch((error) => {
              console.error('PWA ServiceWorker registration failed:', error);
            });
        });
      }
    </script>
  </body>
</html>
