# Netlify 生产环境构建配置
[build]
  command = "npm run build:client"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--legacy-peer-deps"

# API 路由转发至 Netlify Serverless Functions
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# 单页应用 SPA 路由兜底
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# 静态资源缓存控制
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
